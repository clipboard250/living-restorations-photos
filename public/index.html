<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share your photos | Living Restorations</title>
<meta name="description" content="Share your photos and videos from a Living Restorations event.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --terracotta:#a5423b; --teal:#6ca698; --sand:#fbf6ed;
    --charcoal:#3b3836; --stone:#a69689; --teal-deep:#4f8a7c;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--sand); color:var(--charcoal);
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    font-size:1rem; line-height:1.6; min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .shore{
    background:var(--teal); color:var(--sand);
    padding:calc(env(safe-area-inset-top,0px) + 22px) 24px 0;
    text-align:center;
  }
  .wordmark{font-weight:700;letter-spacing:.18em;font-size:.95rem;margin:0}
  .shore svg{display:block;width:100%;height:48px;margin-top:22px}
  main{max-width:34rem;margin:0 auto;padding:28px 24px 48px}
  h1{
    color:var(--terracotta);font-weight:700;text-transform:uppercase;
    font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15;letter-spacing:.02em;
    margin:0 0 10px;
  }
  .meta{font-weight:500;margin:0;color:var(--charcoal)}
  .venue{margin:2px 0 0;color:var(--stone);font-size:.9rem}
  .intro{margin:22px 0 26px}
  label.field{display:block;font-weight:500;margin-bottom:6px}
  input[type=text]{
    width:100%;font:inherit;padding:12px 14px;border:2px solid var(--stone);
    border-radius:10px;background:#fff;color:var(--charcoal);
  }
  .hint{font-size:.85rem;color:var(--stone);margin:6px 0 22px}
  .pick{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;width:100%;min-height:150px;padding:24px;cursor:pointer;
    border:2px dashed var(--teal);border-radius:18px;background:#fff;
    text-align:center;font-weight:500;
  }
  .pick strong{font-size:1.15rem;color:var(--teal-deep)}
  .pick span{font-size:.85rem;color:var(--stone);font-weight:400}
  .pick:hover{background:#f3f9f7}
  #files{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #files:focus-visible + .pick,
  input:focus-visible, button:focus-visible{outline:3px solid var(--terracotta);outline-offset:3px}
  ul.queue{list-style:none;padding:0;margin:22px 0 0}
  .queue li{
    display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
    padding:10px 0;border-bottom:1px solid #eadfcf;font-size:.9rem;
  }
  .queue .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .queue .state{color:var(--stone);font-size:.8rem}
  .queue .state.ok{color:var(--teal-deep);font-weight:500}
  .queue .state.err{color:var(--terracotta);font-weight:500}
  .bar{grid-column:1/-1;height:6px;background:#eadfcf;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
  .done{
    margin-top:26px;padding:18px 20px;border-radius:14px;
    background:var(--terracotta);color:var(--sand);
  }
  .done p{margin:0}
  .done button{
    margin-top:12px;font:inherit;font-weight:500;border:0;border-radius:999px;
    padding:10px 20px;background:var(--sand);color:var(--terracotta);cursor:pointer;
  }
  .closed{padding:20px;border:2px solid var(--stone);border-radius:14px}
  footer{text-align:center;font-size:.8rem;color:var(--stone);padding:0 24px 32px}
  footer a{color:var(--teal-deep)}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header class="shore">
  <p class="wordmark">LIVING RESTORATIONS</p>
  <svg viewBox="0 0 1200 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 22 C150 4 300 40 450 22 S750 4 900 22 S1100 40 1200 20 L1200 48 L0 48 Z" fill="#fbf6ed"/>
  </svg>
</header>

<main id="app">
  <h1 id="title">Share your photos</h1>
  <p class="meta" id="date"></p>
  <p class="venue" id="venue"></p>

  <div id="uploader">
    <p class="intro">Add the photos and videos you took tonight. They come straight to our team, and you can add as many as you like.</p>

    <label class="field" for="who">Your name (optional)</label>
    <input type="text" id="who" autocomplete="name" maxlength="40">
    <p class="hint">So we can thank you if we share your shot.</p>

    <input type="file" id="files" accept="image/*,video/*" multiple>
    <label class="pick" for="files">
      <strong>Choose photos or videos</strong>
      <span>From your camera roll. Videos up to 500 MB each.</span>
    </label>

    <ul class="queue" id="queue" aria-live="polite"></ul>

    <div class="done" id="done" hidden>
      <p>Uploaded. Thank you for sharing the night with us.</p>
      <button type="button" id="more">Add more</button>
    </div>
  </div>
</main>

<footer>
  <a href="https://www.livingrestorations.com">livingrestorations.com</a>
</footer>

<script type="module">
  import { upload } from 'https://esm.sh/@vercel/blob@0.27.0/client';
  import { EVENTS } from '/events.js';

  const slug = location.pathname.split('/').filter(Boolean)[0] || '';
  const ev = EVENTS[slug];
  const $ = id => document.getElementById(id);

  if (!ev) {
    $('title').textContent = 'Event not found';
    $('uploader').innerHTML = '<p class="closed">Check the QR code or link and try again.</p>';
  } else {
    document.title = `Share your photos | ${ev.name}`;
    $('title').textContent = ev.name;
    $('date').textContent = ev.date;
    $('venue').textContent = ev.venue;
    if (!ev.open) {
      $('uploader').innerHTML = '<p class="closed">Uploads for this event are closed. Thank you to everyone who shared.</p>';
    }
  }

  const clean = s => s.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);

  async function send(file) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="name"></span><span class="state">Waiting</span><span class="bar"><i></i></span>';
    li.querySelector('.name').textContent = file.name;
    $('queue').append(li);
    const state = li.querySelector('.state'), bar = li.querySelector('.bar i');

    const who = clean($('who').value) || 'guest';
    const path = `events/${slug}/${who}-${clean(file.name) || 'file'}`;
    try {
      state.textContent = 'Uploading';
      await upload(path, file, {
        access: 'public',
        handleUploadUrl: '/api/upload',
        onUploadProgress: p => { bar.style.width = p.percentage + '%'; }
      });
      bar.style.width = '100%';
      state.textContent = 'Done';
      state.className = 'state ok';
      return true;
    } catch (e) {
      state.textContent = 'Did not upload. Try this one again.';
      state.className = 'state err';
      return false;
    }
  }

  const input = $('files');
  if (input) {
    input.addEventListener('change', async () => {
      const list = [...input.files];
      if (!list.length) return;
      $('done').hidden = true;
      let ok = 0;
      for (const f of list) if (await send(f)) ok++;
      input.value = '';
      if (ok) $('done').hidden = false;
    });
    $('more').addEventListener('click', () => input.click());
  }
</script>
</body>
</html>
